<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CraftPort Server Panel</title>
<style>
  :root { --bg:#141821; --card:#1d2330; --line:#2a3245; --fg:#dfe6f2; --sub:#8b96ad; --acc:#4f8ef7; --ok:#3ecf8e; --err:#f06060; --warn:#f0b548; --input:#12161f; --logbg:#0d1117; --ghostbg:#2a3245; --ghostfg:#ffffff; --overlay:rgba(0,0,0,.55); color-scheme:dark; }
  body.light { --bg:#f2f4f8; --card:#ffffff; --line:#d8deea; --fg:#1d2634; --sub:#6a7590; --acc:#2f6fe4; --ok:#189a64; --err:#d64545; --warn:#b97a12; --input:#edf0f7; --logbg:#f7f9fc; --ghostbg:#e3e8f2; --ghostfg:#1d2634; --overlay:rgba(30,40,70,.35); color-scheme:light; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 "Segoe UI",system-ui,sans-serif; }
  header { padding:14px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:17px; font-weight:600; }
  header .right { display:flex; align-items:center; gap:12px; }
  header span { color:var(--sub); font-size:12px; }
  #langBtn, #themeBtn, #settingsBtn { background:transparent; border:1px solid var(--line); color:var(--fg); padding:4px 12px; font-size:12px; cursor:pointer; }
  main { display:grid; grid-template-columns: 380px minmax(0, 1fr); gap:16px; padding:16px 22px; height:calc(100vh - 56px); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; overflow:auto; }
  .card h2 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--sub); }
  label { display:block; margin:8px 0 4px; color:var(--sub); font-size:12px; }
  input[type=text], input[type=number], select { width:100%; background:var(--input); border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:7px 9px; font-size:13px; }
  input[type=checkbox] { accent-color:var(--acc); }
  button { background:var(--acc); color:#fff; border:0; border-radius:6px; padding:8px 14px; font-size:13px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  button.ghost { background:var(--ghostbg); color:var(--ghostfg); }
  button.danger { background:var(--err); }
  button:disabled { opacity:.45; cursor:default; }
  .server { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; cursor:pointer; }
  .server:hover, .server.sel { border-color:var(--acc); }
  .server .name { font-weight:600; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; margin-left:6px; }
  .b-run { background:rgba(62,207,142,.15); color:var(--ok); }
  .b-stop { background:rgba(139,150,173,.15); color:var(--sub); }
  .b-ext { background:rgba(240,181,72,.15); color:var(--warn); }
  .row { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  #log { background:var(--logbg); border:1px solid var(--line); border-radius:8px; flex:1; min-height:0; margin:8px 0; overflow:auto; padding:10px; font:12px/1.45 Consolas,"JetBrains Mono",monospace; white-space:pre-wrap; word-break:break-all; }
  #log .err { color:var(--err); } #log .warn { color:var(--warn); }
  .console-top { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .console-top input { flex:1; }
  .progress { height:8px; background:var(--input); border-radius:4px; overflow:hidden; margin-top:10px; display:none; }
  .progress > div { height:100%; background:var(--acc); width:0; transition:width .3s; }
  .muted { color:var(--sub); font-size:12px; }
  #hostStats { color:var(--sub); font-size:12px; white-space:nowrap; }
  .server-info-btn { position:absolute; top:6px; right:6px; background:transparent; border:0; color:var(--sub); cursor:pointer; font-size:15px; padding:2px 6px; line-height:1; }
  .server-info-btn:hover { color:var(--acc); }
  .server { position:relative; }
  .detail-grid { display:grid; grid-template-columns:130px 1fr; gap:5px 12px; font-size:13px; margin:12px 0; word-break:break-all; }
  .detail-grid .k { color:var(--sub); }
  #detailPlayers { font-size:15px; font-weight:600; color:var(--fg); }
  .settings-field { margin-bottom:10px; }
  .ver-row { display:flex; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line); align-items:flex-start; cursor:pointer; }
  .ver-row:last-child { border-bottom:0; }
  .ver-row:hover { background:var(--input); }
  .ver-row input { margin-top:2px; flex:none; }
  .ver-main { flex:1; min-width:0; }
  .ver-name { font-size:13px; font-weight:600; word-break:break-all; }
  .ver-meta { color:var(--sub); font-size:11px; }
  .overlay { position:fixed; inset:0; background:var(--overlay); display:none; align-items:center; justify-content:center; z-index:10; }
  .overlay.open { display:flex; }
  .props-card { width:min(720px, 92vw); max-height:82vh; display:flex; flex-direction:column; }
  .props-card h2 { flex:none; }
  #propsFilter { flex:none; margin-bottom:10px; }
  .props-grid { flex:1; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  .props-row { display:flex; border-bottom:1px solid var(--line); min-height:32px; }
  .props-row:last-child { border-bottom:0; }
  .props-row.hide { display:none; }
  .props-key { width:250px; flex:none; padding:6px 10px; font:12px/1.6 Consolas,monospace; color:var(--sub); background:var(--input); word-break:break-all; }
  .props-val { flex:1; width:100%; background:transparent; border:0; color:var(--fg); padding:6px 10px; font:12px Consolas,monospace; outline:none; border-radius:0; }
  .props-val:focus { background:var(--logbg); }
  .props-val bool { padding:6px 9px; }
  .right-col { display:flex; flex-direction:column; gap:16px; min-height:0; min-width:0; }
  .left-col { display:flex; flex-direction:column; gap:16px; min-height:0; min-width:0; overflow:hidden; }
  .deploy-card { flex:none; max-height:70%; overflow:auto; }
  .servers-card { flex:1; min-height:0; }
  .mods-card { flex:1; min-height:0; min-width:0; display:flex; flex-direction:column; }
  .mods-card .row select { width:auto; flex:none; }
  .mods-list { flex:1; overflow:auto; border:1px solid var(--line); border-radius:8px; margin-top:8px; }
  .mod-item { display:flex; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line); align-items:flex-start; min-width:0; }
  .mod-item:last-child { border-bottom:0; }
  .mod-icon { width:36px; height:36px; border-radius:6px; flex:none; object-fit:cover; background:#12161f; border:1px solid var(--line); }
  .mod-actions { display:flex; gap:6px; align-items:center; flex:none; }
  .wiki-link { background:var(--ghostbg); color:var(--ghostfg); border-radius:6px; padding:8px 12px; font-size:13px; text-decoration:none; white-space:nowrap; }
  .wiki-link:hover { filter:brightness(1.15); }
  .icon-btn { width:36px; height:36px; padding:0; display:inline-flex; align-items:center; justify-content:center; border-radius:6px; }
  .icon-btn svg { display:block; }
  .mod-main { flex:1; min-width:0; }
  .mod-name { font-weight:600; font-size:13px; }
  .mod-sum { color:var(--sub); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mod-dl { color:var(--sub); font-size:11px; }
  .console-card { height:250px; flex:none; min-width:0; display:flex; flex-direction:column; }
  .console-head { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .console-card.collapsed { height:auto; }
  .console-card.collapsed #log, .console-card.collapsed .console-top, .console-card.collapsed .console-note { display:none; }
  #modType, #modSource, #modLoader { width:auto; flex:none; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="title"></h1>
  <div class="right">
    <span id="hostStats"></span>
    <span data-i18n="subtitle"></span>
    <button id="themeBtn" onclick="toggleTheme()"></button>
    <button id="langBtn" onclick="toggleLang()"></button>
    <button id="settingsBtn" onclick="openSettings()" title="Settings">⚙</button>
  </div>
</header>
<main>
  <div class="left-col">
    <div class="card deploy-card">
      <h2 data-i18n="deployTitle"></h2>
      <label data-i18n="mcVersion"></label>
      <div class="row" style="margin:0">
        <select id="mc" style="flex:1"></select>
        <button class="ghost" onclick="loadVersions()" data-i18n="refresh"></button>
      </div>
      <div class="muted" data-i18n="versionsHint"></div>
      <label data-i18n="type"></label>
      <select id="type">
        <option value="vanilla" data-i18n="type_vanilla"></option>
        <option value="fabric" data-i18n="type_fabric"></option>
        <option value="forge" data-i18n="type_forge"></option>
        <option value="neoforge" data-i18n="type_neoforge"></option>
        <option value="paper" data-i18n="type_paper"></option>
      </select>
      <label style="margin-top:10px"><input type="checkbox" id="eula"> <span data-i18n="eula"></span> <a href="https://aka.ms/MinecraftEULA" target="_blank" style="color:var(--acc)">EULA</a></label>
      <div class="row"><button id="deployBtn" onclick="deploy()" data-i18n="deploy"></button></div>
      <label data-i18n="modpackFrom" style="margin-top:14px"></label>
      <input type="text" id="packQuery" placeholder="Fabulously Optimized">
      <div class="row"><button class="ghost" onclick="deployModpack()" data-i18n="deployPackBtn"></button></div>
      <div class="progress" id="depProg"><div id="depBar"></div></div>
      <div class="muted" id="depMsg"></div>
    </div>
    <div class="card servers-card">
      <h2 data-i18n="servers"></h2>
      <div id="servers"><div class="muted"></div></div>
    </div>
  </div>
  <div class="right-col">
    <div class="card mods-card">
      <h2 data-i18n="modsTitle"></h2>
      <div class="row" style="margin:0">
        <input type="text" id="modQuery" style="flex:1;min-width:140px" data-i18n-ph="modsSearchPh" onkeydown="if(event.key==='Enter')searchMods()">
        <select id="modType" onchange="onModFilterChange()">
          <option value="mod" data-i18n="type_mod"></option>
          <option value="resourcepack" data-i18n="type_resourcepack"></option>
          <option value="shader" data-i18n="type_shader"></option>
          <option value="datapack" data-i18n="type_datapack"></option>
        </select>
        <select id="modSource" onchange="onModFilterChange()">
          <option value="curseforge">CurseForge</option>
          <option value="modrinth">Modrinth</option>
        </select>
        <select id="modLoader">
          <option value="fabric">Fabric</option>
          <option value="forge">Forge</option>
          <option value="neoforge">NeoForge</option>
        </select>
        <button onclick="searchMods()" data-i18n="modsSearch"></button>
      </div>
      <div class="muted" id="modTarget" style="margin-top:6px"></div>
      <div class="muted" id="modMode"></div>
      <div class="progress" id="modProg"><div id="modBar"></div></div>
      <div class="muted" id="modMsg"></div>
      <div class="mods-list" id="modList"><div class="muted"></div></div>
    </div>
    <div class="card console-card" id="consoleCard">
      <div class="console-head">
        <h2 style="cursor:pointer;margin:0" onclick="toggleConsole()"><span data-i18n="console"></span> <span id="conName" class="muted"></span></h2>
        <div class="row" style="margin:0" onclick="event.stopPropagation()">
          <button class="ghost" onclick="doStart()" data-i18n="start"></button>
          <button class="ghost" onclick="doStop()" data-i18n="stop"></button>
          <button class="danger" onclick="doKill()" data-i18n="kill"></button>
          <button class="ghost" onclick="openProps()" data-i18n="props"></button>
          <button class="danger" id="delBtn" onclick="doDelete()" data-i18n="delete"></button>
          <button class="ghost" id="conToggleBtn" onclick="toggleConsole()" data-i18n="collapse"></button>
        </div>
      </div>
      <div id="log"><div class="muted"></div></div>
      <div class="console-top">
        <input type="text" id="cmd" data-i18n-ph="cmdPlaceholder" onkeydown="if(event.key==='Enter')sendCmd()">
        <button onclick="sendCmd()" data-i18n="send"></button>
      </div>
      <div class="muted console-note" data-i18n="note"></div>
    </div>
  </div>
</main>
<div class="overlay" id="propsOverlay" onclick="if(event.target===this)closeProps()">
  <div class="card props-card">
    <h2><span data-i18n="propsTitle"></span> <span id="propsName" class="muted"></span></h2>
    <input type="text" id="propsFilter" data-i18n-ph="propsFilter" oninput="filterProps()">
    <div class="props-grid" id="propsGrid"></div>
    <div class="row">
      <button onclick="saveProps()" data-i18n="save"></button>
      <button class="ghost" onclick="closeProps()" data-i18n="close"></button>
      <span class="muted" id="propsMsg"></span>
    </div>
  </div>
</div>
<div class="overlay" id="settingsOverlay" onclick="if(event.target===this)closeSettings()">
  <div class="card props-card">
    <h2 data-i18n="settingsTitle"></h2>
    <div class="settings-field">
      <label data-i18n="setMemory"></label>
      <input type="number" id="setMemory" min="512" max="65536">
    </div>
    <div class="settings-field">
      <label data-i18n="setJvm"></label>
      <input type="text" id="setJvm" data-i18n-ph="setJvmPh">
    </div>
    <div class="settings-field">
      <label data-i18n="setSpeed"></label>
      <input type="number" id="setSpeed" min="0">
    </div>
    <div class="settings-field">
      <label data-i18n="setDeployDir"></label>
      <input type="text" id="setDeployDir" data-i18n-ph="setDeployDirPh">
    </div>
    <div class="row">
      <button onclick="saveSettings()" data-i18n="save"></button>
      <button class="ghost" onclick="closeSettings()" data-i18n="close"></button>
      <span class="muted" id="setMsg"></span>
    </div>
  </div>
</div>
<div class="overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="card props-card">
    <h2><span data-i18n="detailTitle"></span> <span id="detailName" class="muted"></span></h2>
    <div class="detail-grid" id="detailGrid"></div>
    <div id="detailPlayers"></div>
    <div class="row" style="margin-top:12px">
      <button class="ghost" onclick="closeDetail()" data-i18n="close"></button>
    </div>
  </div>
</div>
<div class="overlay" id="verOverlay" onclick="if(event.target===this)closeVersions()">
  <div class="card props-card">
    <h2><span data-i18n="verTitle"></span> <span id="verName" class="muted"></span></h2>
    <div class="props-grid" id="verList"></div>
    <div class="row" style="margin-top:12px">
      <button onclick="installVersion()" data-i18n="verInstall"></button>
      <button class="ghost" onclick="closeVersions()" data-i18n="close"></button>
      <span class="muted" id="verMsg"></span>
    </div>
  </div>
</div>
<script>
// ==================== 主题 ====================
function applyTheme() {
  const light = localStorage.getItem('pclj-theme') === 'light';
  document.body.classList.toggle('light', light);
  document.getElementById('themeBtn').textContent = light ? '🌙' : '☀️';
}
function toggleTheme() {
  localStorage.setItem('pclj-theme', localStorage.getItem('pclj-theme') === 'light' ? 'dark' : 'light');
  applyTheme();
}

function t(key) {
  const args = Array.prototype.slice.call(arguments, 1);
  let s = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  args.forEach((a, i) => { s = s.split("{" + i + "}").join(a); });
  return s;
}

// ==================== API ====================
async function api(path, body) {
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  return r.json();
}

function errMsg(data) {
  if (data.code && I18N[lang] && I18N[lang][data.code]) return t(data.code, data.port != null ? data.port : "");
  return data.error || "unknown error";
}

let selected = null, since = 0, pollTimer = null, logErr = 0;

function selectServer(s) {
  selected = s.dir;
  since = 0;
  logErr = 0;
  document.getElementById('conName').textContent = '— ' + s.name;
  document.getElementById('log').innerHTML = '';
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollLogs, 1000);
  pollLogs();
  loadServers();
  updateModTarget();
  if (hotMode) setModModeLabel();
  // 图标按钮的悬停提示跟随语言
  document.querySelectorAll('#modList [data-title-key]').forEach(el => {
    el.title = t(el.dataset.titleKey);
    el.setAttribute('aria-label', t(el.dataset.titleKey));
  });
}

async function pollLogs() {
  if (!selected) return;
  const data = await api('/api/logs?dir=' + encodeURIComponent(selected) + '&since=' + since);
  if (data.error) {
    // Start 后进程注册存在瞬间窗口：容错重试，连续失败才停止轮询
    if (++logErr > 10) {
      const box = document.getElementById('log');
      box.innerHTML += '<div class="err">' + errMsg(data) + '</div>';
      clearInterval(pollTimer);
    }
    return;
  }
  logErr = 0;
  const box = document.getElementById('log');
  for (const line of data.lines) {
    const div = document.createElement('div');
    if (/ERROR|SEVERE|Exception/.test(line)) div.className = 'err';
    else if (/WARN/.test(line)) div.className = 'warn';
    div.textContent = line;
    box.appendChild(div);
  }
  since = data.next;
  box.scrollTop = box.scrollHeight;
}

let deleteArmed = false, deleteTimer = null;
async function doDelete() {
  if (!selected) return;
  const btn = document.getElementById('delBtn');
  if (!deleteArmed) {
    deleteArmed = true;
    btn.textContent = t('confirmDelete');
    deleteTimer = setTimeout(() => { deleteArmed = false; btn.textContent = t('delete'); }, 3000);
    return;
  }
  deleteArmed = false;
  clearTimeout(deleteTimer);
  btn.textContent = t('delete');
  const r = await api('/api/delete', {dir: selected});

    const box = document.getElementById('log');
    box.innerHTML += '<div class="err">' + errMsg(r) + '</div>';

async function openProps() {

  document.getElementById('propsName').textContent = '— ' + selected.split(/[\\/]/).pop();

  const data = await api('/api/props?dir=' + encodeURIComponent(selected));

  renderProps(data.props);

function renderProps(props) {
  const grid = document.getElementById('propsGrid');
  grid.innerHTML = '';
  for (const p of props) {
    const row = document.createElement('div');
    row.className = 'props-row';
    row.dataset.key = p.k;
    const key = document.createElement('div');
    key.className = 'props-key';
    key.textContent = p.k;
    row.appendChild(key);
    let input;
    if (p.v === 'true' || p.v === 'false') {
      // 布尔项渲染为下拉,避免手输拼写错误
      input = document.createElement('select');
      input.className = 'props-val';
      for (const b of ['true', 'false']) {
        const opt = document.createElement('option');
        opt.value = b; opt.textContent = b;
        if (b === p.v) opt.selected = true;
        input.appendChild(opt);
      }
    } else {
      input = document.createElement('input');
      input.type = 'text';
      input.className = 'props-val';
      input.value = p.v;
    }
    row.appendChild(input);
    grid.appendChild(row);
  }
  filterProps();
}

function filterProps() {
  const q = document.getElementById('propsFilter').value.trim().toLowerCase();
  document.querySelectorAll('#propsGrid .props-row').forEach(r => {
    r.classList.toggle('hide', !!q && !r.dataset.key.toLowerCase().includes(q));

const ICON_INSTALL = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

let fetchSeq = 0;
async function fetchMods(query, type, source) {
  const mySeq = ++fetchSeq;
  const list = document.getElementById('modList');
  list.innerHTML = '<div class="muted" style="padding:8px 10px">' + t('modsSearching') + '</div>';
  const data = await api('/api/mods/search?query=' + encodeURIComponent(query) + '&source=' + source + '&type=' + type);
  if (mySeq !== fetchSeq) return;   // 已有更新的搜索,丢弃过期响应(如迟迟未归的热门榜)
  if (data.error) { list.innerHTML = '<div class="muted" style="padding:8px 10px">' + errMsg(data) + '</div>'; return; }
  modResults = data.results || [];
  if (!modResults.length) {
    list.innerHTML = '<div class="muted" style="padding:8px 10px">' + t('modsNoResult') + '</div>';
    return;
  }
  list.innerHTML = '';
  modResults.forEach((m, i) => {
    const row = document.createElement('div');
    row.className = 'mod-item';
    if (m.icon) {
      const img = document.createElement('img');
      img.className = 'mod-icon';
      img.loading = 'lazy';
      img.src = m.icon;
      img.onerror = () => img.remove();
      row.appendChild(img);
    }
    const main = document.createElement('div');
    main.className = 'mod-main';
    main.innerHTML = '<div class="mod-name">' + escapeHtml(m.name)
      + ' <span class="mod-dl">↓ ' + Number(m.downloads).toLocaleString() + '</span></div>'
      + '<div class="mod-sum" title="' + escapeHtml(m.summary || '') + '">' + escapeHtml(m.summary || '') + '</div>';
    const actions = document.createElement('div');
    actions.className = 'mod-actions';
    if (m.wikiUrl) {
      const wiki = document.createElement('a');
      wiki.className = 'wiki-link icon-btn';
      wiki.href = m.wikiUrl;
      wiki.target = '_blank';
      wiki.rel = 'noopener';
      wiki.innerHTML = ICON_WIKI;
      wiki.title = t('wikiLink');
      wiki.setAttribute('aria-label', t('wikiLink'));
      wiki.dataset.titleKey = 'wikiLink';
      wiki.dataset.modName = m.name;
      actions.appendChild(wiki);
    }
    const btn = document.createElement('button');
    btn.className = 'ghost icon-btn';
    btn.innerHTML = ICON_INSTALL;
    btn.title = t('install');
    btn.setAttribute('aria-label', t('install'));
    btn.dataset.titleKey = 'install';
    btn.onclick = () => openVersions(i, btn);
    actions.appendChild(btn);
    row.appendChild(main);
    row.appendChild(actions);
    list.appendChild(row);
  });
  // 后台把前 10 条 mc百科链接升级为词条直达(顺序请求防限流;失败保持搜索页回退)
  const seq = ++wikiResolveSeq;
  (async () => {
    for (let j = 0; j < Math.min(10, modResults.length); j++) {
      if (seq !== wikiResolveSeq) return;
      const m = modResults[j];
      if (!m.wikiUrl) continue;
      try {
        const r = await api('/api/mods/mcmod?name=' + encodeURIComponent(m.name));
        if (r.url && seq === wikiResolveSeq) {
          m.wikiUrl = r.url;
          const link = document.querySelectorAll('#modList .wiki-link')[j];
          if (link) link.href = r.url;
        }
      } catch (e) { /* 保持搜索页回退 */ }
    }
  })();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let verCtx = null; // {index, btn}
async function openVersions(i, btn) {
  if (!selected) { document.getElementById('modMsg').textContent = t('modsNeedServer'); return; }

    + '&type=' + type + '&id=' + encodeURIComponent(modResults[i].id)
    + '&loader=' + (type === 'mod' ? document.getElementById('modLoader').value : '');
  const d = await api('/api/mods/files?' + q);
  if (d.error) { list.innerHTML = '<div class="muted" style="padding:8px 10px">' + errMsg(d) + '</div>'; return; }
  if (!d.files.length) { list.innerHTML = '<div class="muted" style="padding:8px 10px">' + t('verNone') + '</div>'; return; }
  list.innerHTML = '';
  d.files.forEach((f, fi) => {
    const row = document.createElement('label');
    row.className = 'ver-row';
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'verSel';
    radio.value = f.fileId;
    if (fi === 0) radio.checked = true;   // 默认最新
    const main = document.createElement('div');
    main.className = 'ver-main';
    const sizeMb = f.size > 0 ? (f.size / 1048576).toFixed(1) + 'MB' : '';
    const vers = (f.versions || []).slice(0, 5).join(', ');
    main.innerHTML = '<div class="ver-name">' + escapeHtml(f.name) + '</div>'
      + '<div class="ver-meta">' + escapeHtml((f.date || '').slice(0, 10))
      + (sizeMb ? ' · ' + sizeMb : '') + (vers ? ' · ' + escapeHtml(vers) : '') + '</div>';
    row.appendChild(radio);
    row.appendChild(main);
    list.appendChild(row);
  });
}
function installVersion() {
  if (!verCtx) return;
  const sel = document.querySelector('#verList input[name=verSel]:checked');
  const fileId = sel ? sel.value : null;
  const ctx = verCtx;
  closeVersions();
  installMod(ctx.m, ctx.btn, fileId);
}

async function installMod(m, btn, fileId) {
  if (!selected) { document.getElementById('modMsg').textContent = t('modsNeedServer'); return; }
  const type = document.getElementById('modType').value;
  const body = {dir: selected, source: m.source, type: type, id: m.id,
                loader: type === 'mod' ? document.getElementById('modLoader').value : null};
  if (fileId) body.fileId = fileId;
  const msg = document.getElementById('modMsg'), prog = document.getElementById('modProg'), bar = document.getElementById('modBar');
  btn.disabled = true;
  prog.style.display = 'block';
  msg.textContent = t('modsInstalling');
  const res = await api('/api/mods/install', body);
  if (res.error) {
    msg.textContent = errMsg(res);
    prog.style.display = 'none';
    btn.disabled = false;
    return;
  }
  const timer = setInterval(async () => {
    const st = await api('/api/mods/status');
    if (st.error) { clearInterval(timer); msg.textContent = errMsg(st); prog.style.display = 'none'; btn.disabled = false; return; }
    bar.style.width = Math.round((st.percent || 0) * 100) + '%';
    if (st.done) {
      clearInterval(timer);
      prog.style.display = 'none';
      btn.disabled = false;
      msg.textContent = t('modsDone', (st.installed || []).length, (st.skipped || []).length, (st.failed || []).length)
        + ((st.failed || []).length ? ' ' + t('modsFailList', st.failed.join(', ')) : '');
    }
  }, 800);
}

  const status = d.running ? t('status_running')
    : (d.external ? t('status_external')
    : (d.exitCode !== undefined ? t('status_exited', d.exitCode) : t('status_stopped')));
  const rows = [
    [t('detailType'), (d.mc || '?') + (d.type ? ' · ' + d.type.toUpperCase() : '')],
    [t('detailPort'), d.port],
    [t('detailEula'), d.eula ? '✓' : '✗'],
    [t('detailStatus'), status],
    [t('detailPid'), d.pid !== undefined ? d.pid : '—'],
    [t('detailDir'), d.dir],
  ];
  if (d.motd) rows.push(['MOTD', d.motd]);
  if (d.serverVersion) rows.push(['Version', d.serverVersion]);
  document.getElementById('detailGrid').innerHTML = rows
    .map(r => '<div class="k">' + escapeHtml(r[0]) + '</div><div>' + escapeHtml(String(r[1])) + '</div>').join('');
  document.getElementById('detailPlayers').textContent =
    d.playersOnline !== undefined ? t('playersOnline', d.playersOnline, d.playersMax) : t('playersUnknown');
}
function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  if (detailTimer) clearInterval(detailTimer);
  detailDir = null;
}

// ==================== 部署 ====================
async function deployModpack() {
  const btn = event.target;
  btn.disabled = true;
  const query = document.getElementById('packQuery').value.trim();
  const mc = document.getElementById('mc').value.trim();
  const eula = document.getElementById('eula').checked;
  const msg = document.getElementById('depMsg'), prog = document.getElementById('depProg'), bar = document.getElementById('depBar');
  if (!query) { msg.textContent = t('noServers'); btn.disabled = false; return; }
  prog.style.display = 'block'; msg.textContent = t('deployStarting');
  const res = await api('/api/deploy-modpack', {query, mc, eula});
  if (res.error) { msg.textContent = errMsg(res); btn.disabled = false; return; }
  const timer = setInterval(async () => {
    const st = await api('/api/deploy/status');
    bar.style.width = Math.round((st.percent || 0) * 100) + '%';
    msg.textContent = (t('phase_' + st.phase) || st.phase) + (st.phase === 'installing' && st.percent > 0 ? ' ' + Math.round(st.percent * 100) + '%' : '');
    if (st.done) {
      clearInterval(timer); btn.disabled = false;
      msg.dataset.key = st.error ? 'deployFailed' : 'deployDone';
      msg.dataset.arg = st.error || st.resultDir || '';
      msg.textContent = t(msg.dataset.key, msg.dataset.arg);
      loadServers();
    }
  }, 800);
}

async function deploy() {
  const btn = document.getElementById('deployBtn');
  btn.disabled = true;
  const mc = document.getElementById('mc').value.trim();
  const type = document.getElementById('type').value;
  const eula = document.getElementById('eula').checked;
  const msg = document.getElementById('depMsg'), prog = document.getElementById('depProg'), bar = document.getElementById('depBar');
  prog.style.display = 'block'; msg.textContent = t('deployStarting');
  const res = await api('/api/deploy', {mc, type, eula});
  if (res.error) { msg.textContent = errMsg(res); btn.disabled = false; return; }
  const timer = setInterval(async () => {
    const st = await api('/api/deploy/status');
    bar.style.width = Math.round((st.percent || 0) * 100) + '%';
    msg.textContent = t('phase_' + st.phase) || st.phase;
    if (st.done) {
      clearInterval(timer); btn.disabled = false;
      msg.dataset.key = st.error ? 'deployFailed' : 'deployDone';
      msg.dataset.arg = st.error || st.resultDir || '';
      msg.textContent = t(msg.dataset.key, msg.dataset.arg);
      loadServers();
    }
  }, 800);
}

applyLang();
loadServers();
loadVersions();
updateModTarget();
onModFilterChange();
pollHost();
setInterval(pollHost, 3000);
setInterval(loadServers, 3000);
